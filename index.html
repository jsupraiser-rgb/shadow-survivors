<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Shadow Survivors</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
    body {
      background: #050508;
      color: #ddd;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 960px;
      height: 100vh;
      max-height: 540px;
      background: #0a0a12;
      border: 2px solid #222;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0a0a12;
    }

    #ui {
      text-shadow: 0 0 10px rgba(0,0,0,1);
    }
    .stat {
      background: rgba(10,10,20,0.85);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #combo-display {
      text-shadow: 0 0 20px var(--color, #c9a0ff);
      font-style: italic;
      transform: translateX(-50%) scale(1.2);
    }
    .btn {
      background: rgba(40,40,60,0.85);
      border: 2px solid rgba(255,255,255,0.3);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.1);
    }
    .btn:active {
      box-shadow: 0 0 20px #a070ff, inset 0 0 20px #a070ff;
    }
    #joystick-base {
      background: rgba(40,40,60,0.7);
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    #joystick-knob {
      background: radial-gradient(circle at 30% 30%, #a070ff, #5a3a9a);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    #ui {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: none; /* Hidden during intro */
      justify-content: space-between;
      gap: 6px;
      pointer-events: none;
      z-index: 20;
      flex-wrap: wrap;
    }
    .stat {
      background: rgba(0,0,0,0.75);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 13px;
      border: 1px solid #333;
      white-space: nowrap;
    }
    #combo-counter {
      display: none;
      color: #c9a0ff;
      border-color: #7a5ab0;
    }
    #combo-display {
      position: absolute;
      top: 55px;
      left: 50%;
      transform: translateX(-50%); /* overridden above */
      font-size: 20px;
      font-weight: bold;
      color: #c9a0ff;
      text-shadow: 0 0 12px #a070ff;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 25;
    }
    #level-name {
      position: absolute;
      top: 48px;
      left: 12px;
      font-size: 13px;
      color: #aaa;
      pointer-events: none;
      z-index: 20;
      display: none;
    }
    #controls {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      display: none; /* Hidden during intro */
      justify-content: space-between;
      padding: 0 12px;
      pointer-events: none;
      z-index: 20;
    }
    .btn {
      width: 64px;
      height: 64px;
      background: rgba(30,30,50,0.8);
      border: 2px solid #555;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #ccc;
      pointer-events: auto;
    }
    .btn:active {
      background: rgba(90,70,140,0.95);
      border-color: #a070ff;
    }
    #joystick-area {
      width: 110px;
      height: 110px;
      position: relative;
      pointer-events: auto;
    }
    #joystick-base {
      width: 90px;
      height: 90px;
      background: rgba(30,30,50,0.55);
      border: 2px solid #444;
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      left: 10px;
    }
    #joystick-knob {
      width: 38px;
      height: 38px;
      background: rgba(120,100,180,0.9);
      border-radius: 50%;
      position: absolute;
      top: 26px;
      left: 26px;
    }
    #right-btns {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    /* --- HERO SELECTION (Shadow Fight 3 Vibe) --- */
    #hero-select {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #1a1a2e 0%, #050508 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }
    .shadow-title {
      color: #fff;
      font-size: 36px;
      text-transform: uppercase;
      letter-spacing: 6px;
      margin-bottom: 5px;
      text-shadow: 0 0 20px rgba(255,255,255,0.5);
    }
    .shadow-subtitle {
      color: #888;
      font-size: 14px;
      letter-spacing: 3px;
      margin-bottom: 40px;
      text-transform: uppercase;
    }
    #hero-cards {
      display: flex;
      gap: 15px;
      max-width: 800px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .hero-card {
      width: 140px;
      height: 200px;
      background: #111;
      border: 2px solid #333;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 20px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .hero-card:hover, .hero-card.selected {
      border-color: #fff;
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    .hero-card h3 {
      font-size: 18px;
      z-index: 2;
      color: #eee;
    }
    .hero-card p {
      font-size: 12px;
      color: #aaa;
      z-index: 2;
      margin-top: 4px;
    }
    .hero-silhouette {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%); /* overridden above */
      width: 80px;
      height: 120px;
      background: #000;
      mask-image: url('kael_sheet.png');
      -webkit-mask-image: url('kael_sheet.png');
      mask-position: 0 0;
      -webkit-mask-position: 0 0;
      mask-size: cover;
      -webkit-mask-size: auto 120px;
      z-index: 1;
      opacity: 0.8;
      transition: all 0.3s ease;
    }
    .hero-card:hover .hero-silhouette, .hero-card.selected .hero-silhouette {
      opacity: 1;
    }
    .glow-fx {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 60%;
      background: linear-gradient(to top, var(--color), transparent);
      opacity: 0.3;
      z-index: 0;
    }
    #start-game-btn {
      margin-top: 40px;
      padding: 12px 40px;
      background: transparent;
      border: 2px solid #fff;
      color: white;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
    }
    #start-game-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #start-game-btn:hover {
      background: #fff;
      color: #000;
    }

    #message {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      text-align: center;
      padding: 20px;
    }
    #message h1 {
      color: #c9a0ff;
      font-size: 26px;
      margin-bottom: 10px;
    }
    #message p {
      max-width: 340px;
      line-height: 1.45;
      margin-bottom: 6px;
      font-size: 14px;
      color: #ccc;
    }
    #message button {
      margin-top: 18px;
      padding: 12px 28px;
      background: #5a3a9a;
      border: none;
      color: white;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
    }

    .intro-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 15;
      pointer-events: none;
      transition: opacity 3s ease-in-out;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <!-- Intro Black Overlay for fade-in effect -->
    <div id="intro-overlay" class="intro-overlay" style="display: none;"></div>

    <div id="ui">

      <div class="stat">❤️ <span id="hp">100</span></div>
      <div class="stat" id="level-display" style="color: #66ccff; border-color: #4488cc;">Lvl 1 [0/100 XP]</div>

      <div class="stat">💀 <span id="kills">0</span></div>
      <div class="stat">✨ <span id="souls">0</span></div>
      <div class="stat" id="weapon-display">👊 Bare Hands</div>
      <div class="stat" id="combo-counter">
        COMBO <span id="combo-num">0</span>
        <span id="combo-mult" style="color:#ffcc66; margin-left:4px;"></span>
      </div>
    </div>


    <div id="boss-ui" style="display: none; position: absolute; top: 80px; left: 50%; transform: translateX(-50%); /* overridden above */ width: 60%; z-index: 20;">
      <div style="text-align: center; color: #ff5555; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; text-shadow: 0 0 5px red;">Void Knight</div>
      <div style="width: 100%; height: 12px; background: #222; border: 2px solid #555; border-radius: 6px; overflow: hidden;">
        <div id="boss-hp-fill" style="width: 100%; height: 100%; background: linear-gradient(to right, #800, #f00); transition: width 0.2s;"></div>
      </div>
    </div>

    <div id="level-name">Level 1 – The Shadow Ruins</div>
    <div id="combo-display">3-HIT COMBO!</div>

    <div id="controls">
      <div id="joystick-area">
        <div id="joystick-base">
          <div id="joystick-knob"></div>
        </div>
      </div>
      <div id="right-btns">
        <div class="btn" id="jump-btn">⬆</div>
        <div class="btn" id="attack-btn">⚔️</div>
        <div class="btn" id="special-btn">💥</div>
      </div>
    </div>

    <!-- Hero Selection Screen -->
    <div id="hero-select">
      <h1 class="shadow-title">Shadow Survivors</h1>
      <p class="shadow-subtitle">Choose Your Legend</p>


      <div id="hero-cards">
        <div class="hero-card" data-hero="kael" style="--color: #a070ff;">
          <div class="hero-silhouette"></div>
          <div class="glow-fx"></div>
          <h3>Kael</h3>
          <p>The Shadow Blade</p>
        </div>
        <div class="hero-card" data-hero="lyra" style="--color: #40ff80;">
          <div class="hero-silhouette" style="-webkit-mask-position: -128px 0;"></div>
          <div class="glow-fx"></div>
          <h3>Lyra</h3>
          <p>The Assassin</p>
        </div>
        <div class="hero-card" data-hero="vex" style="--color: #ff8040;">
          <div class="hero-silhouette" style="-webkit-mask-position: -256px 0;"></div>
          <div class="glow-fx"></div>
          <h3>Vex</h3>
          <p>The Tank</p>
        </div>
        <div class="hero-card" data-hero="nyx" style="--color: #40c0ff;">
          <div class="hero-silhouette" style="-webkit-mask-position: -384px 0;"></div>
          <div class="glow-fx"></div>
          <h3>Nyx</h3>
          <p>The Gunner</p>
        </div>
      </div>

      <button id="start-game-btn">Enter the Shadows</button>
    </div>

    <div id="message">
      <h1 id="msg-title">You Fell</h1>
      <p id="msg-desc">The shadows consume you.</p>
      <p>Kills: <span id="msg-kills">0</span> | Souls: <span id="msg-souls">0</span></p>
      <button id="restart-btn">Try Again</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
