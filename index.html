<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Shadow Survivors – Level 1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
    body {
      background: #050508;
      color: #ddd;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 960px;
      height: 100vh;
      max-height: 540px;
      background: #0a0a12;
      border: 2px solid #222;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0a0a12;
    }
    #ui {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      pointer-events: none;
      z-index: 20;
      flex-wrap: wrap;
    }
    .stat {
      background: rgba(0,0,0,0.75);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 13px;
      border: 1px solid #333;
      white-space: nowrap;
    }
    #combo-counter {
      display: none;
      color: #c9a0ff;
      border-color: #7a5ab0;
    }
    #combo-display {
      position: absolute;
      top: 55px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      font-weight: bold;
      color: #c9a0ff;
      text-shadow: 0 0 12px #a070ff;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 25;
    }
    #level-name {
      position: absolute;
      top: 48px;
      left: 12px;
      font-size: 13px;
      color: #aaa;
      pointer-events: none;
      z-index: 20;
    }
    #controls {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 12px;
      pointer-events: none;
      z-index: 20;
    }
    .btn {
      width: 64px;
      height: 64px;
      background: rgba(30,30,50,0.8);
      border: 2px solid #555;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #ccc;
      pointer-events: auto;
    }
    .btn:active {
      background: rgba(90,70,140,0.95);
      border-color: #a070ff;
    }
    #joystick-area {
      width: 110px;
      height: 110px;
      position: relative;
      pointer-events: auto;
    }
    #joystick-base {
      width: 90px;
      height: 90px;
      background: rgba(30,30,50,0.55);
      border: 2px solid #444;
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      left: 10px;
    }
    #joystick-knob {
      width: 38px;
      height: 38px;
      background: rgba(120,100,180,0.9);
      border-radius: 50%;
      position: absolute;
      top: 26px;
      left: 26px;
    }
    #right-btns {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #message {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      text-align: center;
      padding: 20px;
    }
    #message h1 {
      color: #c9a0ff;
      font-size: 26px;
      margin-bottom: 10px;
    }
    #message p {
      max-width: 340px;
      line-height: 1.45;
      margin-bottom: 6px;
      font-size: 14px;
      color: #ccc;
    }
    #message button {
      margin-top: 18px;
      padding: 12px 28px;
      background: #5a3a9a;
      border: none;
      color: white;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <div id="ui">
      <div class="stat">❤️ <span id="hp">100</span></div>
      <div class="stat">💀 <span id="kills">0</span></div>
      <div class="stat">✨ <span id="souls">0</span></div>
      <div class="stat">👊 Bare Hands</div>
      <div class="stat" id="combo-counter">
        COMBO <span id="combo-num">0</span>
        <span id="combo-mult" style="color:#ffcc66; margin-left:4px;"></span>
      </div>
    </div>

    <div id="level-name">Level 1 – Dust of Champions</div>
    <div id="combo-display">3-HIT COMBO!</div>

    <div id="controls">
      <div id="joystick-area">
        <div id="joystick-base">
          <div id="joystick-knob"></div>
        </div>
      </div>
      <div id="right-btns">
        <div class="btn" id="jump-btn">⬆</div>
        <div class="btn" id="attack-btn">👊</div>
        <div class="btn" id="special-btn">💥</div>
      </div>
    </div>

    <div id="message">
      <h1>Shadow Survivors</h1>
      <p><strong>Level 1 – Dust of Champions</strong></p>
      <p>The arena has fallen. Survive the first Void wave.</p>
      <p style="margin-top:12px;font-size:13px;color:#aaa">
        Move with joystick<br>
        👊 Attack (Jab → Cross → Spin Kick)<br>
        ⬆ Jump / Double Jump<br>
        💥 Heavy Fist
      </p>
      <button id="start-btn">Start Level 1</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
